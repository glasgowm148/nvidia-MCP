name: Test and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
        # The package supports mcp>=1.28,<3: test the oldest supported and the newest release.
        # mcp 2.2+ also pulls in httpx2; this package still uses httpx directly.
        mcp: ['oldest', 'latest']
    name: ${{ matrix.os }} / py${{ matrix.python }} / mcp ${{ matrix.mcp }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - if: matrix.mcp == 'oldest'
        run: python -m pip install "mcp==1.28.*"
      - if: matrix.mcp == 'latest'
        run: python -m pip install --upgrade "mcp<3"
      - run: python -m pip show mcp
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python -m build
      - run: python scripts/test_wheel.py
      - run: python scripts/check_release.py dist/*.whl dist/*.tar.gz
        shell: bash
