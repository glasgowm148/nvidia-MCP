[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "nvidia-shield-mcp"
version = "0.3.1"
description = "Local MCP tools for NVIDIA Shield TV and Kodi diagnostics, backups and repairs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["mcp>=1.28,<3", "httpx>=0.28,<1", "defusedxml>=0.7,<1"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "build>=1.2,<2"]

[project.scripts]
nvidia-mcp = "nvidia_mcp.server:main"

[project.urls]
Repository = "https://github.com/glasgowm148/nvidia-MCP"
Issues = "https://github.com/glasgowm148/nvidia-MCP/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/nvidia_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/nvidia_mcp", "tests", "scripts", "docs", "examples", ".github", ".gitattributes", ".env.example", "pyproject.toml", "README.md", "CHANGELOG.md", "CONTRIBUTING.md", "LICENSE", "SECURITY.md", "AGENTS.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
