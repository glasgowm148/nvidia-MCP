name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub prerelease
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Tag must equal the package version
        shell: bash
        run: |
          version=$(python -c "import re,pathlib;print(re.search(r'^__version__ = \"([^\"]+)\"$', pathlib.Path('src/nvidia_mcp/__init__.py').read_text(), re.M).group(1))")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}" >&2
            exit 1
          fi
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - run: python -m build
      - run: python scripts/test_wheel.py
      - run: python scripts/check_release.py dist/*.whl dist/*.tar.gz --write-checksums dist/SHA256SUMS
        shell: bash
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.whl dist/*.tar.gz dist/SHA256SUMS \
            src/nvidia_mcp/companion/*.zip \
            --prerelease --title "nvidia-MCP ${GITHUB_REF_NAME#v}" --notes-file CHANGELOG.md
      # Optional PyPI publishing. Prefer trusted publishing (no stored secrets): configure the
      # project on PyPI, add `id-token: write` to this job's permissions, then uncomment:
      # - uses: pypa/gh-action-pypi-publish@release/v1
      #   with:
      #     packages-dir: dist/
