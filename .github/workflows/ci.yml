name: Test and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
        # The package supports mcp>=1.28,<3: test the oldest supported and the newest release.
        # mcp 2.2+ also pulls in httpx2; this package still uses httpx directly.
        mcp: ['oldest', 'latest']
    name: ${{ matrix.os }} / py${{ matrix.python }} / mcp ${{ matrix.mcp }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - if: matrix.mcp == 'oldest'
        run: python -m pip install "mcp==1.28.*"
      - if: matrix.mcp == 'latest'
        run: python -m pip install --upgrade "mcp<3"
      - run: python -m pip show mcp
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python -m build
      - run: python scripts/test_wheel.py
      - run: python scripts/check_release.py dist/*.whl dist/*.tar.gz
        shell: bash

  apple-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev,apple-tv]"
      # SDK API plus synthetic transports only; never scans or connects to a LAN device.
      - run: pytest -q tests/test_apple_tv.py

  manager-parity:
    # Byte parity of the vendored route_guard.py/operation_records.py and the MCP<->Manager
    # integration test need the Kodi Manager checkout; here a missing one fails instead of skipping.
    runs-on: ubuntu-latest
    env:
      NVIDIA_MCP_MANAGER_CHECKOUT: ${{ github.workspace }}/kodi-manager
      NVIDIA_MCP_REQUIRE_MANAGER: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: glasgowm148/kodi-manager
          path: kodi-manager
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q tests/test_browse_routes.py tests/test_operation_integration.py
